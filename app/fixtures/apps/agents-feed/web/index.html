<!doctype html><html><body style="margin:0;background:var(--app-bg);color:var(--app-text);font:13px system-ui">
<canvas id="c" width="900" height="300" style="width:100%;height:300px"></canvas>
<script>
const c = document.getElementById('c'), g = c.getContext('2d')
let feed = null, flash = null
const pos = (i, n) => [80 + (i % 6) * 140, 80 + Math.floor(i / 6) * 120]
function draw() {
  g.clearRect(0, 0, c.width, c.height)
  if (!feed) { g.fillStyle = '#888'; g.fillText('waiting for hermes.agents…', 20, 30); return }
  const where = {}
  feed.agents.forEach((a, i) => { const [x, y] = pos(i, feed.agents.length); where[a.id] = [x, y]
    g.fillStyle = a.look.color; g.beginPath(); g.arc(x, y, a.status === 'working' ? 26 : 20, 0, 7); g.fill()
    g.fillStyle = getComputedStyle(document.body).color; g.textAlign = 'center'; g.fillText(a.name, x, y + 44) })
  where.you = [450, 280]
  if (flash && Date.now() - flash.at < 4000) { g.strokeStyle = '#fff'; g.lineWidth = 3
    for (const to of flash.to) { const a = where[flash.from], b = where[to]; if (a && b) { g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke() } }
    g.fillStyle = '#fff'; g.textAlign = 'left'; g.fillText(`onTalk: ${flash.from} → ${flash.to.join(', ')} (${flash.kind})`, 12, 18) }
}
hermes.onAgents((f) => { feed = f; draw() })
hermes.onTalk((t) => { flash = { ...t, at: Date.now() }; draw() })
setInterval(draw, 500)
</script></body></html>
